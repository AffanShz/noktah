name: release-native

# Membangun aplikasi Rust native dengan MSVC lalu menerbitkannya sebagai
# GitHub Release ketika ada tag v*.
#
# MSVC dipakai karena binary hasil MSVC memakai runtime Microsoft dan jauh
# lebih jarang kena flag heuristik antivirus dibanding MinGW.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build dan terbitkan
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Verifikasi konsistensi versi
        shell: pwsh
        working-directory: native
        run: |
          $manifests = @("core/Cargo.toml", "app/Cargo.toml", "hook/Cargo.toml")
          $versions = @(foreach ($m in $manifests) {
            $line = Get-Content $m | Where-Object { $_ -match '^version\s*=\s*"([^"]+)"' } | Select-Object -First 1
            if (-not $line -or $line -notmatch '^version\s*=\s*"([^"]+)"') {
              throw "Versi tidak ditemukan di $m"
            }
            $Matches[1]
          })
          $unique = @($versions | Select-Object -Unique)
          if ($unique.Count -ne 1) {
            throw "Versi manifest tidak konsisten: $($versions -join ', ')"
          }
          $ver = [string]$unique[0]
          Write-Host "Versi manifest terverifikasi: $ver"
          if ($env:GITHUB_REF_TYPE -eq "tag" -and "v$ver" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME tidak cocok dengan versi Cargo.toml v$ver"
          }
          "CARGO_VER=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Jalankan unit & layout test
        working-directory: native
        run: cargo test --workspace --target x86_64-pc-windows-msvc

      - name: Build release
        working-directory: native
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Verifikasi VERSIONINFO awal
        shell: pwsh
        working-directory: native
        run: |
          $exe = "target/x86_64-pc-windows-msvc/release/noktah-native.exe"
          $hook = "target/x86_64-pc-windows-msvc/release/noktah-hook.exe"
          if (-not (Test-Path $exe)) { throw "exe tidak ditemukan" }
          if (-not (Test-Path $hook)) { throw "noktah-hook.exe tidak ditemukan" }

          $ver = (Get-Item $exe).VersionInfo
          $hookVer = (Get-Item $hook).VersionInfo
          if ([string]::IsNullOrWhiteSpace($ver.ProductName)) {
            throw "VERSIONINFO kosong pada noktah-native.exe: resource tidak tertanam"
          }
          if ([string]::IsNullOrWhiteSpace($hookVer.ProductName)) {
            throw "VERSIONINFO kosong pada noktah-hook.exe: resource tidak tertanam"
          }

      - name: Deteksi mode penandatanganan digital
        id: detect_signing
        shell: pwsh
        env:
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CODE_SIGNING_ACCOUNT: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
        run: |
          $hasAzure = -not [string]::IsNullOrWhiteSpace($env:AZURE_TRUSTED_SIGNING_ENDPOINT) -and
            -not [string]::IsNullOrWhiteSpace($env:AZURE_CLIENT_ID) -and
            -not [string]::IsNullOrWhiteSpace($env:AZURE_TENANT_ID) -and
            -not [string]::IsNullOrWhiteSpace($env:AZURE_CLIENT_SECRET) -and
            -not [string]::IsNullOrWhiteSpace($env:AZURE_CODE_SIGNING_ACCOUNT) -and
            -not [string]::IsNullOrWhiteSpace($env:AZURE_CERT_PROFILE)
          $mode = if ($hasAzure) {
            "azure"
          } elseif (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_BASE64)) {
            "pfx"
          } else {
            "unsigned"
          }
          "mode=$mode" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Mode penandatanganan terdeteksi: $mode"

      - name: Tanda tangani biner dengan Azure Trusted Signing
        id: sign_azure
        if: steps.detect_signing.outputs.mode == 'azure'
        uses: azure/trusted-signing-action@v0.5.0
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\native\target\x86_64-pc-windows-msvc\release
          files-folder-filter: exe
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verifikasi & catat status Azure Trusted Signing
        if: steps.sign_azure.outcome == 'success'
        shell: pwsh
        run: |
          foreach ($bin in @(
            "native/target/x86_64-pc-windows-msvc/release/noktah-native.exe",
            "native/target/x86_64-pc-windows-msvc/release/noktah-hook.exe"
          )) {
            $sig = Get-AuthenticodeSignature $bin
            if ($sig.Status -ne 'Valid') {
              throw "Tanda tangan Authenticode tidak valid pada $bin ($($sig.Status))"
            }
          }
          "SIGNING_STATUS=signed-azure" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Tanda tangani biner dengan sertifikat PFX (Authenticode)
        id: sign_pfx
        if: steps.detect_signing.outputs.mode == 'pfx'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = "Stop"
          $pfxPath = Join-Path $env:RUNNER_TEMP "cert.pfx"
          $tsUrl = if ([string]::IsNullOrWhiteSpace($env:WINDOWS_TIMESTAMP_URL)) {
            "http://timestamp.digicert.com"
          } else {
            $env:WINDOWS_TIMESTAMP_URL.Trim()
          }
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) {
            throw "signtool.exe (Windows Kits 10 x64) tidak ditemukan"
          }

          try {
            $bytes = [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_BASE64.Trim())
            [System.IO.File]::WriteAllBytes($pfxPath, $bytes)

            foreach ($bin in @(
              "native/target/x86_64-pc-windows-msvc/release/noktah-native.exe",
              "native/target/x86_64-pc-windows-msvc/release/noktah-hook.exe"
            )) {
              $signArgs = @("sign", "/f", $pfxPath)
              if (-not [string]::IsNullOrEmpty($env:WINDOWS_SIGNING_CERT_PASSWORD)) {
                $signArgs += @("/p", $env:WINDOWS_SIGNING_CERT_PASSWORD)
              }
              $signArgs += @("/fd", "SHA256", "/tr", $tsUrl, "/td", "SHA256", $bin)
              & $signtool.FullName @signArgs
              if ($LASTEXITCODE -ne 0) {
                throw "signtool sign gagal untuk $bin (exit $LASTEXITCODE)"
              }
              & $signtool.FullName verify /pa $bin
              if ($LASTEXITCODE -ne 0) {
                throw "signtool verify gagal untuk $bin (exit $LASTEXITCODE)"
              }
            }
            "SIGNING_STATUS=signed-pfx" | Out-File -FilePath $env:GITHUB_ENV -Append
          } finally {
            if (Test-Path -LiteralPath $pfxPath) {
              Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Catat status penandatanganan (fallback unsigned)
        if: steps.detect_signing.outputs.mode == 'unsigned'
        shell: pwsh
        run: |
          Write-Host "::notice::Secrets Code Signing belum dikonfigurasi; biner dirilis tanpa tanda tangan digital (unsigned)."
          "SIGNING_STATUS=unsigned" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verifikasi dan hitung hash
        shell: pwsh
        working-directory: native
        run: |
          $exe = "target/x86_64-pc-windows-msvc/release/noktah-native.exe"
          $hook = "target/x86_64-pc-windows-msvc/release/noktah-hook.exe"
          if (-not (Test-Path $exe)) { throw "exe tidak ditemukan" }
          if (-not (Test-Path $hook)) { throw "noktah-hook.exe tidak ditemukan" }

          $f = Get-Item $exe
          $hf = Get-Item $hook
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $hookHash = (Get-FileHash $hook -Algorithm SHA256).Hash.ToLower()
          $ver = $f.VersionInfo
          $hookVer = $hf.VersionInfo

          Write-Host ("Ukuran      : {0:N2} MB" -f ($f.Length / 1MB))
          Write-Host ("SHA-256     : {0}" -f $hash)
          Write-Host ("Produk      : {0}" -f $ver.ProductName)
          Write-Host ("Hook        : {0}" -f $hookHash)
          Write-Host ("Hook Produk : {0}" -f $hookVer.ProductName)
          Write-Host ("Signing     : {0}" -f $env:SIGNING_STATUS)

          if ([string]::IsNullOrWhiteSpace($ver.ProductName)) {
            throw "VERSIONINFO kosong pada noktah-native.exe: resource tidak tertanam"
          }
          if ([string]::IsNullOrWhiteSpace($hookVer.ProductName)) {
            throw "VERSIONINFO kosong pada noktah-hook.exe: resource tidak tertanam"
          }

          "SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append
          "HOOKSHA256=$hookHash" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Susun paket
        shell: pwsh
        working-directory: native
        run: |
          $dir = "dist"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/noktah-native.exe" $dir
          Copy-Item "target/x86_64-pc-windows-msvc/release/noktah-hook.exe" $dir

          $signNote = switch ($env:SIGNING_STATUS) {
            "signed-azure" { "Ditandatangani secara digital (Azure Trusted Signing Authenticode)." }
            "signed-pfx"   { "Ditandatangani secara digital (sertifikat Authenticode PFX + timestamp RFC3161)." }
            default        { "File ini TIDAK ditandatangani secara digital (unsigned build)." }
          }

          @"
          Noktah $env:GITHUB_REF_NAME — aplikasi Rust native
          ================================================

          File     : noktah-native.exe
          SHA256   : $env:SHA256
          Pendamping: noktah-hook.exe
          SHA256   : $env:HOOKSHA256
          Build    : GitHub Actions, MSVC, profil release (LTO + strip)
          Status   : $signNote

          Overlay notch untuk Windows: jendela transparan tanpa dekorasi yang
          selalu di atas, membaca lagu dari SMTC, menampilkan lirik tersinkron,
          tugas, fokus, cuaca, dan chat AI.

          Soal noktah-hook.exe
          --------------------
          Ini biner pendamping kecil untuk halaman Agent dan tile status kustom.
          Ia meneruskan event agent (termasuk permintaan izin) dan metrik ke Noktah.
          Simpan keduanya di folder yang sama, atau pasang via winget agar otomatis
          tersedia di PATH.

          Catatan verifikasi & antivirus
          ------------------------------
          $signNote
          Pemindai heuristik terkadang memberi peringatan pada binary baru karena
          berjalan sebagai overlay transparan di atas layar.

          1. Periksa kedua checksum di atas sama dengan file yang kamu unduh.
          2. Laporkan sebagai false positive bila perlu:
             https://www.microsoft.com/en-us/wdsi/filesubmission
          3. Atau tambahkan folder ini sebagai exclusion — jangan matikan
             real-time protection secara global.
          "@ | Set-Content "$dir/BACA-DULU.txt" -Encoding UTF8

          $zipName = "noktah-$env:GITHUB_REF_NAME-win64.zip"
          Compress-Archive -Path "$dir/*" -DestinationPath $zipName -Force
          $zipHash = (Get-FileHash $zipName -Algorithm SHA256).Hash.ToUpper()
          "ZIP_SHA256=$zipHash" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Buat & validasi manifest winget
        shell: pwsh
        working-directory: native
        run: |
          $tag = $env:GITHUB_REF_NAME
          $ver = if ($env:GITHUB_REF_TYPE -eq "tag") { $tag } else { $env:CARGO_VER }
          $zipUrl = "https://github.com/AffanShz/noktah/releases/download/$tag/noktah-$tag-win64.zip"
          & ../packaging/winget/generate-manifests.ps1 `
            -Version $ver `
            -InstallerUrl $zipUrl `
            -InstallerSha256 $env:ZIP_SHA256 `
            -OutputDir "dist-winget"
          & ../packaging/winget/validate-manifests.ps1 `
            -ManifestDir "dist-winget" `
            -ExpectedVersion $ver
          Compress-Archive -Path "dist-winget/*" -DestinationPath "noktah-$tag-winget-manifests.zip" -Force

      - name: Terbitkan release
        uses: softprops/action-gh-release@v2
        with:
          name: Noktah ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            native/noktah-${{ github.ref_name }}-win64.zip
            native/noktah-${{ github.ref_name }}-winget-manifests.zip
            native/dist/noktah-native.exe
            native/dist/noktah-hook.exe

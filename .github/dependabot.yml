version: 2
updates:
  # Rust — workspace native (core, app, hook)
  - package-ecosystem: cargo
    directory: "/native"
    target-branch: "develop"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "[AS] chore(deps)"
    pull-request-branch-name:
      prefix: "chore"
      template: "{prefix}/{name}"
      word-separator: "-"
      branch-name-case: "lowercase"
      max-length: 60
    # Naik major di crate ini hampir selalu berarti API berubah dan harus
    # diuji manual di Windows — jangan biarkan bot memutuskan.
    ignore:
      - dependency-name: "windows"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eframe"
        update-types: ["version-update:semver-major"]
      - dependency-name: "egui"
        update-types: ["version-update:semver-major"]
      - dependency-name: "rusqlite"
        update-types: ["version-update:semver-major"]

  # Actions
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: monthly
    commit-message:
      prefix: "[AS] chore(ci)"
    pull-request-branch-name:
      prefix: "chore"
      template: "{prefix}/{name}"
      word-separator: "-"
      branch-name-case: "lowercase"
      max-length: 60

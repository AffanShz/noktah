<!doctype html><html lang="id"><meta charset="utf-8"><title>Noktah Icon Pack</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:light dark;--bg:#f2f2f7;--fg:#1d1d1f;--mut:#6e6e73}
@media(prefers-color-scheme:dark){:root{--bg:#111114;--fg:#f5f5f7;--mut:#98989d}}
body{margin:0;padding:40px 24px;background:var(--bg);color:var(--fg);font:15px -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}
main{max-width:960px;margin:auto}
h1{font-size:28px;margin:0 0 4px} p{color:var(--mut);margin:0 0 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:20px}
figure{margin:0;text-align:center} figure img{width:100%;display:block}
figcaption{margin-top:6px;font-weight:600} small{display:block;font-weight:400;color:var(--mut);font-size:12px}
h2{font-size:18px;margin:44px 0 12px}
.notch{background:#000;border-radius:0 0 28px 28px;padding:14px 26px;display:flex;gap:22px;justify-content:center;width:fit-content;margin:auto}
.notch img{width:30px;height:30px}
</style>
<main><h1>Noktah Icon Pack</h1><p>8 ikon bergaya macOS untuk panel notch — versi berwarna dan versi glyph.</p>
<div class="grid"><figure><img src="color/music.svg" alt="Musik"><figcaption>Musik<small>music.svg</small></figcaption></figure><figure><img src="color/ai-quota.svg" alt="Kuota AI"><figcaption>Kuota AI<small>ai-quota.svg</small></figcaption></figure><figure><img src="color/lyrics.svg" alt="Lirik"><figcaption>Lirik<small>lyrics.svg</small></figcaption></figure><figure><img src="color/focus.svg" alt="Fokus"><figcaption>Fokus<small>focus.svg</small></figcaption></figure><figure><img src="color/tasks.svg" alt="Tugas"><figcaption>Tugas<small>tasks.svg</small></figcaption></figure><figure><img src="color/system.svg" alt="Sistem"><figcaption>Sistem<small>system.svg</small></figcaption></figure><figure><img src="color/ai-chat.svg" alt="Chat AI"><figcaption>Chat AI<small>ai-chat.svg</small></figcaption></figure><figure><img src="color/settings.svg" alt="Pengaturan"><figcaption>Pengaturan<small>settings.svg</small></figcaption></figure></div>
<h2>Versi glyph di atas notch</h2><div class="notch"><img src="glyph/music.svg" alt=""><img src="glyph/ai-quota.svg" alt=""><img src="glyph/lyrics.svg" alt=""><img src="glyph/focus.svg" alt=""><img src="glyph/tasks.svg" alt=""><img src="glyph/system.svg" alt=""><img src="glyph/ai-chat.svg" alt=""><img src="glyph/settings.svg" alt=""></div></main></html>
